---
# tasks file for monitoring
- name: Vérifier Docker
  command: docker --version
  register: docker_register
  changed_when: false

- name: Créer le dossier Monitoring
  file:
    path: /opt/monitoring
    state: directory
    mode: 0755

- name: Créer le dossier Prometheus
  file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Créer le dossier Grafana
  file:
    path: "{{ grafana_data_dir }}"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"

- name: Déployer la configuration de prometheus
  template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_data_dir }}/prometheus.yml"
    mode: 0644

- name: Déployer docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_base_dir }}/docker-compose.yml"
    mode: 0644

- name: Lancer docker-compose.yml
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_base_dir }}"
    state: present

- name: Vérifier les conteneurs
  command: docker ps
  register: containers
  changed_when: false

- name: Afficher les conteneurs
  debug:
    var: containers.stdout_lines